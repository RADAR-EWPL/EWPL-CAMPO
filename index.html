<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>EWPL Campo</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef6ff;background:#071522}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#071522,#0b2033)}main{max-width:680px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:24px}.sub{font-size:12px;color:#9bb4c9}.status{padding:7px 10px;border-radius:999px;background:#102d45;font-size:12px}.card{background:#0d2539;border:1px solid #1a425f;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0004}textarea,input{width:100%;background:#071b2b;color:#fff;border:1px solid #28516d;border-radius:12px;padding:13px;font:inherit}textarea{min-height:150px;resize:vertical}label{display:block;margin:10px 0 6px;color:#cfe1ef;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:9px;align-items:center}.check input{width:auto}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;font-weight:800;font-size:15px;margin-top:12px;background:#3aa7ff;color:#03121d}.btn.secondary{background:#173a53;color:#eaf6ff}.hint{font-size:12px;color:#9bb4c9;line-height:1.45}.count{font-weight:800}.msg{min-height:22px;margin-top:10px;font-size:13px}.hidden{display:none}.offline{background:#553c16}.ok{color:#75e0a7}.warn{color:#ffd27a}
</style></head><body><main><div class="top"><div><div class="brand">EWPL</div><div class="sub">CAMPO · Nota rápida offline</div></div><div id="estado" class="status">Comprobando…</div></div>
<section class="card"><label>¿Qué necesitas recordar?</label><textarea id="texto" placeholder="Toca aquí y usa el 🎙️ del teclado para dictar…"></textarea><div id="interpretacion" class="hint"></div><label class="check"><input id="recordatorio" type="checkbox"> Crear recordatorio en Google Calendar al sincronizar</label><div id="fechaHora" class="row hidden"><div><label>Fecha</label><input id="fecha" type="date"></div><div><label>Hora</label><input id="hora" type="time"></div></div><button id="guardar" class="btn">Guardar nota</button><div id="mensaje" class="msg"></div></section>
<section class="card"><div><span class="count" id="pendientes">0</span> pendientes de sincronizar</div><div class="hint">Las notas se guardan en este teléfono aunque no haya Internet.</div><button id="sync" class="btn secondary">☁️ Sincronizar ahora</button></section>
<section class="card"><div class="hint">Dictado: usa el micrófono del teclado del teléfono. EWPL Campo no necesita acceso directo al micrófono.</div></section>
<script src="config.js"></script><script src="app.js"></script></main></body></html>
